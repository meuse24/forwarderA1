name: Projektseite aktualisieren

# Traegt die Version eines neuen Releases in index.html (GitHub Pages) nach.
# Der Download-Button bleibt unangetastet - er zeigt auf /releases/latest/download/
# und ist dadurch immer aktuell.
#
# Der Trigger ist "release: published", nicht "push". Der Commit dieses Workflows
# loest deshalb keinen weiteren Lauf aus.

on:
  release:
    types: [published]
  # Manuell nachziehbar, falls ein Release ohne Workflow angelegt wurde.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release-Tag, z. B. V4.1.0"
        required: true

permissions:
  contents: write

jobs:
  update-version:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          # Immer main aktualisieren - Pages wird von dort ausgeliefert.
          ref: main

      - name: Version in index.html eintragen
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: python3 scripts/update_site_version.py --tag "$TAG"

      - name: Aenderung committen
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html war bereits aktuell - kein Commit noetig."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "docs: Projektseite auf $TAG aktualisiert"
          git push
